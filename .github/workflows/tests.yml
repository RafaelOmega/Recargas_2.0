# Roda a suite de testes automaticamente a cada push e pull request.
name: Testes

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      # variáveis dummy: a suite NÃO conecta ao banco; isso só garante
      # que nenhum import leia env ausente durante a coleta dos testes
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME5: recargas
      DB_USER: teste
      DB_PASSWORD: teste
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 psycopg2-binary pytest pytest-qt

      - name: Rodar a suite
        run: pytest -v