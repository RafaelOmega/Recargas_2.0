name: Testes

on:
  push:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen   # Qt sem tela (headless)
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME5: test
      DB_USER: test
      DB_PASSWORD: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip               # cache entre runs

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
          python -m pip install --upgrade pip
          pip install PySide6==6.11.2 psycopg2-binary -r requirements-dev.txt

      - name: Rodar a suite
        run: pytest -q --timeout=120